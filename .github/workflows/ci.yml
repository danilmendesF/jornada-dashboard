name: CI Quality Gate & SDD 2.0 Validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Vitest Test Matrix (Unit, Security, Merge & Contracts)
      run: npx vitest run

    - name: Run Deep Drift Detector
      run: node scripts/drift_check.cjs

    - name: Run SDD 2.0 Governance Gate & Bundle Build
      run: node scripts/validate_sdd.cjs
