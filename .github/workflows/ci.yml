name: CI Quality Gate & SDD 2.0 Validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Dependency Vulnerability Audit
      run: npm audit --audit-level=high

    - name: Run Vitest Test Matrix (Unit, Security, Merge & Contracts)
      run: npx vitest run

    - name: Run Deep Drift Detector
      run: node scripts/drift_check.cjs

    - name: Run SDD 2.0 Governance Gate & Bundle Build
      run: node scripts/validate_sdd.cjs
